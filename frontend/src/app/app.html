<header class="topbar">
  <a routerLink="/" class="brand">JobTest</a>
  <nav>
    @if (auth.user(); as user) {
      <a routerLink="/account">{{ user.name || 'Account' }}</a>
      <button class="link" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/signup" class="btn btn-sm">Sign up</a>
    }
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>
