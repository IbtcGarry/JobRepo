<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">
      <span class="logo">J</span>
      <span>JobTest</span>
    </a>
    <nav class="links">
      <a routerLink="/" fragment="jobs">Jobs</a>
      <a routerLink="/companies">Companies</a>
      <a routerLink="/" fragment="jobs">For founders</a>
    </nav>
    <nav class="session">
      @if (auth.user(); as user) {
        <a routerLink="/account" class="me">
          <app-avatar [name]="user.name" [url]="profiles.avatarUrl()" />
          {{ user.name || 'Account' }}
        </a>
        <button class="link" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login">Log in</a>
        <a routerLink="/signup" class="btn btn-sm">Sign up</a>
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
